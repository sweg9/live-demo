# The Dashboard image for k3s (backend-server deploy/k8s/server/web.yaml).
# Pull requests: typecheck, tests and an image build, nothing pushed.
# main: the same, then the image goes to ghcr.io/sweg9/live-demo as :latest and :<commit>.
name: dashboard-image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: see the Dockerfile (npm 11 and the optional wasm builds)
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sweg9/live-demo:latest
            ghcr.io/sweg9/live-demo:${{ github.sha }}
