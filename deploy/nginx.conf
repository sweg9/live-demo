# nginx for the Dashboard image. Static files only; the ingress sends /api to the server before a
# request gets here.

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers on every answer. They are set here once: a location with its own add_header
    # would drop them, so locations below use `expires` only.
    #   CSP: only this origin. 'wasm-unsafe-eval' lets the 3D map decode its meshopt model;
    #   connect-src 'self' covers /api and the live WebSocket on the same host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The Dashboard never uses the camera or the microphone: no video leaves the home (C-05).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json model/gltf-binary;

    # For the kubelet's probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api belongs to the server. If it ever reaches this pod, answer 404 instead of the app.
    location /api/ {
        return 404;
    }

    # Built files have a hash in their name: cache them for good.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Every other path is a page of the app (React Router): index.html, never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
